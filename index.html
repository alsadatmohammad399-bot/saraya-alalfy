<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سرايا الألفي </title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ee;--card:#fff;--ink:#23160f;--mut:#9a8572;--brown:#3e1e12;--line:#ece0d1;--shadow:0 8px 28px #23160f10;--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo}
.top{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center}
.logo{font-family:Reem Kufi;font-weight:700;color:var(--brown)} .search{flex:1;background:#f7f3ee;border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.cart{position:fixed;bottom:12px;left:12px;right:12px;z-index:70;background:var(--brown);color:#fff;border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;font-weight:900}
.hero{max-width:1200px;margin:auto;padding:14px;display:grid;grid-template-columns:120px 1fr;gap:12px;background:#fff;border-radius:20px;margin-top:12px;border:1px solid var(--line)}
.hero img{width:120px;height:120px;border-radius:16px;object-fit:cover}
.chips{position:sticky;top:56px;z-index:50;background:#f7f3eecc;backdrop-filter:blur(10px);display:flex;gap:8px;overflow:auto;padding:10px 14px}
.chip{flex:none;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:700}.chip.active{background:var(--brown);color:#fff}
main{max-width:1200px;margin:auto;padding:0 14px 110px}
.sec{padding-top:20px} .sec h2{font-family:Reem Kufi;color:var(--brown);margin:0 0 12px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.item img{width:88px;height:88px;border-radius:14px;object-fit:cover;flex:none;background:#f7f3ee}
.info{flex:1;min-width:0}.name{font-weight:900;font-size:1.05rem}.desc{color:var(--mut);font-size:.82rem;margin:4px 0}.price{font-weight:900;color:var(--brown);font-size:1.1rem;margin-top:4px}
.controls{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:92px}
.add-btn{background:var(--brown);color:#fff;border:0;border-radius:12px;padding:8px 18px;font-weight:900;cursor:pointer}
.qty{display:none;align-items:center;gap:6px;background:#f7f3ee;border:1px solid var(--line);border-radius:12px;padding:4px}.qty.on{display:flex}
.qty button{width:28px;height:28px;border-radius:8px;border:0;background:#fff;font-weight:900}
.variant{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.variant button{background:#f7f3ee;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:.78rem;font-weight:700}.variant button.active{background:var(--brown);color:#fff}
.badge{background:#fff2cc;color:#8a5a00;border-radius:99px;padding:2px 8px;font-size:.68rem;font-weight:900;margin-right:6px}
.drawer{position:fixed;inset:0;z-index:80;display:none}.drawer.on{display:block}.bg{position:absolute;inset:0;background:#0006}.panel{position:absolute;inset:auto 0 0 0;background:#fff;border-radius:22px 22px 0 0;max-height:85vh;display:flex;flex-direction:column}
.items{flex:1;overflow:auto;padding:12px} .ci{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--brown);color:#fff;border-radius:99px;padding:8px 18px;opacity:0;transition:.25s;z-index:90}.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="top"><div class="logo">🔥 سرايا الألفي</div><input id="q" class="search" placeholder="ابحث..."><div style="margin-right:auto;background:var(--brown);color:#fff;border-radius:99px;padding:6px 12px;font-weight:800">🛒 <span id="cntTop">0</span></div></div>
<div class="hero"><img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=400"><div><div style="font-weight:900">سرايا الألفي - مشويات على الفحم</div><div style="color:var(--mut);font-size:.85rem">⭐ 4.9 • مشويات • 🕒 30-45 دقيقة • توصيل مجاني</div></div></div>
<div class="chips" id="chips"></div>
<main id="main"></main>
<div class="cart" id="cartBar" onclick="openDrawer()" style="display:none"><span>🛒 عرض السلة</span><span id="cartTotal">0 ج.م</span></div>
<div class="drawer" id="drawer"><div class="bg" onclick="closeDrawer()"></div><div class="panel"><div style="padding:14px;font-weight:900;display:flex;justify-content:space-between"><span>سلتك • <span id="cntDrawer">0</span> صنف</span><button onclick="closeDrawer()" style="border:0;background:#f7f3ee;width:32px;height:32px;border-radius:50%">✕</button></div><div class="items" id="items"></div><div style="padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px"><input id="nm" placeholder="الاسم" style="padding:12px;border:1px solid var(--line);border-radius:12px"><input id="ph" placeholder="الموبايل" style="padding:12px;border:1px solid var(--line);border-radius:12px"><textarea id="ad" placeholder="العنوان" rows="2" style="padding:12px;border:1px solid var(--line);border-radius:12px"></textarea><a id="wa" class="add-btn" style="text-align:center;background:#25d366;color:#06330f;padding:14px" target="_blank">إرسال واتساب</a></div></div></div>
<div class="toast" id="toast"></div>
<script>
const PH='201015861991';
const IMGS={صنية:'https://images.unsplash.com/photo-1544025162-d76694265947?w=300',كباب:'https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=300',كفتة:'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=300',ممبار:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300',default:'https://images.unsplash.com/photo-1544025162-d76694265947?w=300'};
function getImg(n){for(let k in IMGS){if(n.includes(k))return IMGS[k]}return IMGS.default}
const DATA=[{t:'الصواني والسفر',icon:'🍽️',count:8,items:[{n:'صنية التاج',d:'نص كفتة / نص فرخة مشوية / ممبار / أرز بسمتي / سلطة خضراء / طحينة / عيش',p:590,tag:'الأكثر طلباً'},{n:'صنية الباشا',d:'نص كفتة / نص فرخة مشوية / نص ممبار / نص سجق / رز بسمتي / عيش / سلطة خضراء / طحينة',p:990},{n:'صنية الكبير',d:'نص كفتة / نص شيش / ربع طرب / فرخة مشوية / ممبار / أرز بسمتي / محشي / سمبوسة',p:1300},{n:'صنية العز',d:'تلت كفتة / نص بط / نص ممبار / ورقة سجق / 2 حمام / تلت شيش / رز بسمتي',p:1990,tag:'عائلي'},{n:'صنية الهيبة',d:'نص كفتة / نص فراخ مشوية / نص طرب / ربع سجق / 2 حمام / ممبار / طاجن كوارع',p:2300},{n:'صنية الملوك',d:'نص كفتة / نص سجق / نص طرب / 2 حمام / نص ممبار / 1 بط / ورق عنب',p:2850,tag:'ملوكي'},{n:'سفرة الألفي',d:'2 فرخة شيش / 2 كيلو ممبار / كيلو كفتة / نص طرب / نص ريش / نص كباب',p:5000},{n:'السفرة الملكية',d:'فرخة رومي / 2 كيلو ممبار / كيلو كفتة / كيلو سجق / نص طرب / نص ريش',p:7500,tag:'8 أفراد'}]},{t:'وجبات أفراد',icon:'👤',count:3,items:[{n:'وجبة الفرد',d:'2 كفتة + 2 شيش + أرز + سلطة + عيش',p:200},{n:'وجبة الطرب',d:'2 طرب + 2 كفتة + 2 ممبار + أرز + سلطة',p:250},{n:'ميكس جريل',d:'3 كفتة + 3 شيش + 3 كباب + أرز + سلطة',p:400,tag:'جديد'}]},{t:'مشويات الألفي',icon:'🔥',count:12,items:[{n:'كباب بتلو',d:'بتلو طازة على الفحم',pr:[490,1300],lb:['ثلث','كيلو']},{n:'كباب ضاني',d:'ضاني بلدي',pr:[525,1400],lb:['ثلث','كيلو']},{n:'ريش بتلو',pr:[545,1450],lb:['ثلث','كيلو']},{n:'ريش ضاني',pr:[585,1550],lb:['ثلث','كيلو']},{n:'مشكل بتلو',pr:[415,1100],lb:['ثلث','كيلو']},{n:'مشكل ضاني',pr:[435,1150],lb:['ثلث','كيلو']},{n:'كفتة بتلو',pr:[340,900],lb:['ثلث','كيلو']},{n:'كفتة ضاني',pr:[375,1000],lb:['ثلث','كيلو']},{n:'سجق مشوي',pr:[395,1050],lb:['ثلث','كيلو']},{n:'طرب',pr:[470,1250],lb:['ثلث','كيلو'],tag:'الأكثر طلباً'},{n:'كبدة مشوية',pr:[470,1250],lb:['ثلث','كيلو']},{n:'موزة مشوية',pr:[475],lb:['كيلو']}]},{t:'مطبخ الألفي',icon:'🥘',count:15,items:[{n:'ممبار',p:85},{n:'محشي كرنب',p:75},{n:'سمبوسك لحم',p:75},{n:'سمبوسك جبنة',p:65},{n:'صنية رقاق باللحمة',p:185},{n:'بطاطس محمرة',p:35},{n:'مقبلات الألفي',p:185},{n:'أرز أبيض',p:45},{n:'أرز شعرية',p:49},{n:'أرز بسمتي',p:65},{n:'أرز معمر',p:85},{n:'فتة ساده',p:75},{n:'فتة لحمة',p:285},{n:'ورق عنب',p:75},{n:'محشي مشكل',p:85}]},{t:'مميز الألفي',icon:'⭐',count:7,items:[{n:'موزة تركي فخار',d:'موزة - ورق عنب - خضار - أرز بسمتي',p:550,tag:'مميز'},{n:'مبكبكة باللحمة',p:285},{n:'كبسة مضغوطة فراخ',p:295},{n:'ورقة لحمة',p:285},{n:'ورقة سجق',p:250},{n:'ورقة كبدة',p:250},{n:'ورقة الألفي',p:295}]},{t:'الطيور',icon:'🍗',count:5,items:[{n:'فرخة شيش',p:320},{n:'فرخة فحم',p:300},{n:'شيش طاووق على الفحم',p:650},{n:'فرد حمام محشي أرز',p:220},{n:'فرد حمام مشوي',p:190}]},{t:'الطواجن',icon:'🍲',count:10,items:[{n:'طاجن ملوخية ساده',p:60},{n:'طاجن بامية لحم',p:285},{n:'طاجن تورللي لحم',p:255},{n:'طاجن لسان عصفور لحم',p:255},{n:'طاجن كباب حلة',p:295},{n:'طاجن كوارع',p:320},{n:'طاجن كوارع ورق عنب',p:295},{n:'طاجن كوارع بالفتة',p:350},{n:'طاجن عكاوي بصل',p:350},{n:'طاجن حمام بالأرز المعمر',p:230}]},{t:'البط',icon:'🦆',count:3,items:[{n:'بطة كاملة',p:850},{n:'نص بطة',p:425},{n:'ربع بطة',p:220}]},{t:'الشوربة',icon:'🍜',count:2,items:[{n:'شوربة لسان عصفور',p:30},{n:'شوربة كريمة',p:100}]},{t:'السلطات',icon:'🥗',count:12,items:[{n:'سلطة خضراء',p:25},{n:'سلطة طحينة',p:25},{n:'صوص المندي',p:25},{n:'بابا غنوج',p:35},{n:'سلطة باذنجان',p:25},{n:'زبادي خيار',p:45},{n:'خيار مخلل',p:25},{n:'طماطم متبلة',p:35},{n:'سلطة مخلل',p:25},{n:'ثومية',p:45},{n:'كلوسلو',p:45},{n:'مشكل الألفي',p:75}]}];
let cart={};const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}
function build(){document.getElementById('chips').innerHTML=DATA.map((c,i)=>`<button class="chip ${i==0?'active':''}" data-i="${i}">${c.icon} ${c.t}</button>`).join('');document.getElementById('main').innerHTML=DATA.map((c,ci)=>{const list=c.items.map((it,ii)=>{const img=getImg(it.n);const pricePart=it.pr?`<div class="variant">${it.pr.map((p,pi)=>`<button class="vbtn ${pi==0?'active':''}" data-ci="${ci}" data-ii="${ii}" data-pi="${pi}">${it.lb[pi]} ${p} ج.م</button>`).join('')}</div>`:``;const singlePrice=it.p?`${it.p} ج.م`:`${it.pr[0]} ج.م`;return `<div class="item it" data-t="${it.n} ${it.d||''}"><img src="${img}"><div class="info"><div class="name">${it.n} ${it.tag?`<span class="badge">${it.tag}</span>`:''}</div><div class="desc">${it.d||'من مطبخ الألفي'}</div>${pricePart}<div class="price" id="price-${ci}-${ii}">${singlePrice}</div></div><div class="controls"><button class="add-btn" id="add-${ci}-${ii}" onclick="addItem(${ci},${ii})">إضافة</button><div class="qty" id="qty-${ci}-${ii}"><button onclick="changeQty(${ci},${ii},-1)">−</button><b id="q-${ci}-${ii}">1</b><button onclick="changeQty(${ci},${ii},1)">+</button></div></div></div>`}).join('');return `<section class="sec" id="s${ci}"><h2>${c.icon} ${c.t} <span style="background:#f7f3ee;border-radius:99px;padding:2px 10px;font-size:.8rem">${c.count} صنف</span></h2><div class="list">${list}</div></section>`}).join('')}
function getCurrentPrice(ci,ii){const it=DATA[ci].items[ii];if(it.pr){const active=document.querySelector(`.vbtn.active[data-ci="${ci}"][data-ii="${ii}"]`);if(active){const pi=parseInt(active.dataset.pi);return {price:it.pr[pi],label:it.lb[pi],pi}}return {price:it.pr[0],label:it.lb[0],pi:0}}return {price:it.p,label:'',pi:0}}
window.addItem=(ci,ii)=>{const priceInfo=getCurrentPrice(ci,ii);const key=`${ci}-${ii}-${priceInfo.pi}`;if(!cart[key])cart[key]={ci,ii,pi:priceInfo.pi,name:DATA[ci].items[ii].n+(priceInfo.label?` (${priceInfo.label})`:''),price:priceInfo.price,q:0};cart[key].q++;updateUI(ci,ii,key);draw();toast(`تمت إضافة ${cart[key].name} ✓`)}
window.changeQty=(ci,ii,delta)=>{const priceInfo=getCurrentPrice(ci,ii);const key=`${ci}-${ii}-${priceInfo.pi}`;if(!cart[key])return;cart[key].q+=delta;if(cart[key].q<=0)delete cart[key];updateUI(ci,ii,key);draw()}
function updateUI(ci,ii,key){const itKey=`${ci}-${ii}`;const addBtn=document.getElementById(`add-${itKey}`);const qtyDiv=document.getElementById(`qty-${itKey}`);const qEl=document.getElementById(`q-${itKey}`);const cartKey=key||Object.keys(cart).find(k=>k.startsWith(`${ci}-${ii}-`));const item=cart[cartKey];if(item&&item.q>0){addBtn.style.display='none';qtyDiv.classList.add('on');qEl.textContent=item.q;}else{addBtn.style.display='block';qtyDiv.classList.remove('on');}}
function draw(){let total=0,count=0;let html='';Object.values(cart).forEach(it=>{total+=it.price*it.q;count+=it.q;html+=`<div class="ci"><img src="${getImg(it.name)}" style="width:48px;height:48px;border-radius:10px"><div style="flex:1"><div style="font-weight:800">${it.name}</div><div style="color:#9a8572">${it.price} ج.م</div></div><div style="display:flex;align-items:center;gap:8px"><button onclick="changeQty(${it.ci},${it.ii},-1)" style="width:28px;height:28px;border-radius:8px">−</button><b>${it.q}</b><button onclick="changeQty(${it.ci},${it.ii},1)" style="width:28px;height:28px;border-radius:8px">+</button></div></div>`});document.getElementById('items').innerHTML=html||'<div style="text-align:center;color:var(--mut);padding:30px">السلة فاضية</div>';document.getElementById('cntTop').textContent=count;document.getElementById('cntDrawer').textContent=count;document.getElementById('cartTotal').textContent=total+' ج.م';const bar=document.getElementById('cartBar');bar.style.display=count>0?'flex':'none';const name=document.getElementById('nm').value,ph=document.getElementById('ph').value,ad=document.getElementById('ad').value;let lines=Object.values(cart).map(i=>`• ${i.name} × ${i.q} = ${i.q*i.price} ج.م`).join('\n');const txt=`طلب جديد - سرايا الألفي\nالاسم: ${name}\nالموبايل: ${ph}\nالعنوان: ${ad}\n\n${lines}\nالإجمالي: ${total} ج.م`;const ok=count>0&&name.length>1&&ph.length>=10&&ad.length>3;const wa=document.getElementById('wa');wa.style.opacity=ok?'1':'.5';if(ok)wa.href='https://wa.me/'+PH+'?text='+encodeURIComponent(txt);else wa.removeAttribute('href');}
document.addEventListener('click',e=>{const vbtn=e.target.closest('.vbtn');if(vbtn){const ci=vbtn.dataset.ci,ii=vbtn.dataset.ii;const parent=vbtn.closest('.item');parent.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('active'));vbtn.classList.add('active');const pi=parseInt(vbtn.dataset.pi);document.getElementById(`price-${ci}-${ii}`).textContent=DATA[ci].items[ii].pr[pi]+' ج.م';const key=`${ci}-${ii}-${pi}`;const addBtn=document.getElementById(`add-${ci}-${ii}`);const qtyDiv=document.getElementById(`qty-${ci}-${ii}`);const existing=cart[key];if(existing){addBtn.style.display='none';qtyDiv.classList.add('on');document.getElementById(`q-${ci}-${ii}`).textContent=existing.q;}else{addBtn.style.display='block';qtyDiv.classList.remove('on');}}});
window.openDrawer=()=>document.getElementById('drawer').classList.add('on');window.closeDrawer=()=>document.getElementById('drawer').classList.remove('on');
document.getElementById('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('s'+b.dataset.i).scrollIntoView({behavior:'smooth'})};
document.getElementById('q').oninput=e=>{const v=e.target.value.toLowerCase();document.querySelectorAll('.it').forEach(el=>{el.style.display=!v||el.dataset.t.toLowerCase().includes(v)?'':'none'})};
['nm','ph','ad'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
build();draw();
</script>
</body>
</html>
